<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="container">

    <!-- en-tête + navigation -->
    <header class="topbar">
      <h1>{{ title }}</h1>
      <nav class="nav">
        <a class="btn" href="{{ url_for('home') }}">Dashboard</a>
        <a class="btn" href="{{ url_for('articles_ui') }}">Articles</a>
        <a class="btn" href="{{ url_for('contrats_ui') }}">Louer</a>
      </nav>
    </header>

    <!-- formulaire de retour -->
    <section class="card">

      <!-- message d’erreur éventuel -->
      {% if error %}
        <div class="error">{{ error }}</div>
        <div style="height:10px"></div>
      {% endif %}

      <form method="post" class="form">

        <!-- sélection de la ligne de contrat à retourner -->
        <label>Ligne à retourner</label>
        <select name="id_ligne" required>
          <option value="" disabled selected>— Choisir une location en cours —</option>
          {% for r in retours %}
            <option value="{{ r.id_ligne }}">
              Ligne #{{ r.id_ligne }} —
              Article #{{ r.id_article }} ({{ r.marque }} {{ r.modele }}) —
              retour prévu {{ r.date_fin_prevue or "—" }}
            </option>
          {% endfor %}
        </select>

        <!-- date de retour réelle -->
        <label>Date de retour effective
          <input name="date_retour_effective" type="date" required>
        </label>

        <!-- validation -->
        <div class="actions">
          <button class="btn primary" type="submit">
            Enregistrer le retour
          </button>
        </div>

      </form>
    </section>

  </div>
</body>
</html>
